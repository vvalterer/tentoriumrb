{% extends "content/base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="container mt-5">
  <h4 class="mb-4">Восстановление пароля</h4>
  <p>Введите ваш email. Мы отправим ссылку для сброса пароля, если такой email зарегистрирован.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}<br>
    {{ form.email }}<br>
    <button type="submit" class="btn btn-warning mt-3">Отправить</button>
  </form>
</div>
{% endblock %}
