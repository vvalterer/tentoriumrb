{% extends "content/base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="container mt-5">
  <h4>Введите новый пароль</h4>

    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">Сбросить пароль</button>
  </form>
</div>
{% endblock %}
